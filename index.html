<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>江湖閒談錄｜放置打怪</title>
  <meta name="description" content="金庸／古龍風原創江湖放置：創角、掛機打怪、掉寶升級。致敬武俠，非官方改編。" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <section id="screen-create" class="screen create-shell">
      <header class="hero title-hero">
        <p class="eyebrow">致敬金庸／古龍武俠風格 · 原創江湖</p>
        <h1>江湖閒談錄</h1>
        <p class="sub">掛機行走江湖：打怪、掉寶、慢慢變強</p>
      </header>
      <form id="create-form" class="card create-card">
        <div class="create-card-title">踏入江湖</div>
        <label>俠客名號
          <input id="name-input" maxlength="12" placeholder="例如：沈孤舟" required autocomplete="off" />
        </label>
        <fieldset class="look-field">
          <legend>外貌</legend>
          <div id="look-list" class="look-grid" role="listbox" aria-label="外貌"></div>
        </fieldset>
        <fieldset>
          <legend>門派</legend>
          <div id="school-list" class="choice-grid school-icons"></div>
        </fieldset>
        <fieldset>
          <legend>兵器路數</legend>
          <div id="weapon-list" class="choice-grid"></div>
        </fieldset>
        <p class="hint">屬性依門派微調；之後靠掛機打怪成長。故事為原創江湖閒談，不搬用小說原文。</p>
        <button type="submit" class="btn primary full btn-enter">踏入江湖</button>
      </form>
      <p class="disclaimer">本作為原創放置小品，僅借用武俠氛圍與門派意象，非金庸／古龍作品官方改編。</p>
    </section>

    <section id="screen-game" class="screen hidden">
      <header class="topbar hud-bar">
        <div class="hud-left">
          <div class="hud-avatar school-cangjian" id="hud-avatar" aria-hidden="true">俠</div>
          <div class="hud-identity">
            <div class="hud-name-row">
              <strong id="hero-name">—</strong>
              <span class="hud-lv" id="hero-lv">Lv.1</span>
            </div>
            <div class="hud-subrow">
              <span id="hero-meta" class="muted"></span>
              <span class="hud-power">戰力 <b id="stat-power">0</b></span>
            </div>
          </div>
        </div>
        <div class="currencies">
          <span class="cur-pill">銀 <b id="stat-silver">0</b></span>
          <span class="cur-pill">俠 <b id="stat-chivalry">0</b></span>
          <button type="button" id="btn-mute" class="btn-mute" title="靜音切換" aria-label="靜音切換">🔊</button>
        </div>
      </header>

      <div class="hud-exp-row">
        <div class="bar-wrap thin exp-bar" title="經驗">
          <div id="bar-exp" class="bar"></div>
          <span id="stat-exp-label">0 / 0</span>
        </div>
        <div class="hud-stats-mini">
          <span>攻 <b id="stat-atk">0</b></span>
          <span>防 <b id="stat-def">0</b></span>
          <span>速 <b id="stat-spd">0</b></span>
          <span class="hidden">Lv.<b id="stat-lv">1</b></span>
        </div>
      </div>

      <div class="combat card combat-frame">
        <div id="battle-stage" class="battle-stage zone-inn" aria-hidden="false">
          <div class="stage-bg-far" aria-hidden="true"></div>
          <div class="stage-bg-mid" aria-hidden="true"></div>
          <div class="stage-vignette" aria-hidden="true"></div>

          <div class="stage-hud-center" aria-live="polite">
            <div id="auto-status" class="auto-status hidden">自動戰鬥中…</div>
          </div>

          <div class="stage-overlay-top">
            <div class="zone-chip">
              <div class="zone-title" id="zone-name">—</div>
              <div class="muted zone-flavor" id="zone-flavor"></div>
            </div>
            <div class="zone-progress-chip">
              <div class="zone-prog-label" id="zone-kill-label">本區擊殺 0</div>
              <div class="bar-wrap thin zone-prog-bar">
                <div id="bar-zone-prog" class="bar accent-bar"></div>
              </div>
            </div>
          </div>

          <div class="stage-ground"></div>
          <div class="stage-fx" id="stage-fx"></div>

          <div class="fighters-row">
            <div class="fighter hero-side" id="fighter-hero">
              <div class="shadow"></div>
              <div class="sprite" id="hero-sprite">
                <div class="hero-art" id="hero-art" role="img" aria-label="主角"></div>
              </div>
              <div class="fighter-label" id="hero-stage-label">俠客</div>
            </div>

            <div class="enemy-party" id="enemy-party">
              <div class="fighter enemy-side enemy-slot empty" id="enemy-slot-0" data-slot="0">
                <div class="mob-hp-wrap"><div class="mob-hp-bar" id="mob-hp-0"></div></div>
                <div class="shadow"></div>
                <div class="sprite"><div class="enemy-glyph" data-glyph>？</div></div>
                <div class="fighter-label" data-label>等待開打</div>
              </div>
              <div class="fighter enemy-side enemy-slot empty" id="enemy-slot-1" data-slot="1">
                <div class="mob-hp-wrap"><div class="mob-hp-bar" id="mob-hp-1"></div></div>
                <div class="shadow"></div>
                <div class="sprite"><div class="enemy-glyph" data-glyph>？</div></div>
                <div class="fighter-label" data-label></div>
              </div>
              <div class="fighter enemy-side enemy-slot empty" id="enemy-slot-2" data-slot="2">
                <div class="mob-hp-wrap"><div class="mob-hp-bar" id="mob-hp-2"></div></div>
                <div class="shadow"></div>
                <div class="sprite"><div class="enemy-glyph" data-glyph>？</div></div>
                <div class="fighter-label" data-label></div>
              </div>
            </div>
          </div>

          <div id="combat-log" class="log stage-log" aria-live="polite"></div>
        </div>

        <div class="skill-bar" id="skill-bar">
          <button type="button" id="btn-auto" class="skill-auto" aria-pressed="false" title="自動戰鬥">
            <span class="auto-dot"></span>
            <span class="auto-label">自動</span>
          </button>
          <div class="skill-slots" id="skill-slots"></div>
          <button type="button" id="btn-bag" class="skill-bag" title="行囊">行囊</button>
        </div>

        <div class="combat-actions compact combat-actions--legacy" aria-hidden="true">
          <button type="button" id="btn-hunt" class="btn primary">⚔ 開始掛機</button>
          <button type="button" id="btn-stop" class="btn" disabled>■ 停手</button>
        </div>
      </div>

      <nav class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="zones">地圖</button>
        <button type="button" class="tab" data-tab="bag">行囊</button>
        <button type="button" class="tab" data-tab="hero">俠客</button>
        <button type="button" class="tab" data-tab="lore">閒談</button>
      </nav>

      <div id="panel-zones" class="panel card"></div>
      <div id="panel-bag" class="panel card hidden"></div>
      <div id="panel-hero" class="panel card hidden"></div>
      <div id="panel-lore" class="panel card hidden"></div>

      <footer class="footer">
        <button type="button" id="btn-reset" class="btn ghost">重置角色</button>
        <span class="muted">進度自動存於本機</span>
      </footer>
    </section>
  </div>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
